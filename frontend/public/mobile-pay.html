<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Pay with RupayAid</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0F172A; -webkit-font-smoothing: antialiased; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .brand { font-size: 20px; font-weight: 700; color: #0284C7; letter-spacing: 0.5px; margin-bottom: 24px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #E2E8F0; border-top-color: #0284C7; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 16px; color: #475569; line-height: 1.5; }
    .error { background: #FEF2F2; color: #B91C1C; padding: 12px 16px; border-radius: 8px; margin-top: 16px; font-size: 14px; max-width: 360px; }
    button { background: #0284C7; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600; margin-top: 20px; cursor: pointer; }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <main>
    <div class="brand">RupayAid</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Preparing secure checkout&hellip;</div>
    <div class="error" id="error" style="display:none;"></div>
    <button id="retry" style="display:none;">Open checkout</button>
  </main>
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var keyId = params.get('keyId');
      var orderId = params.get('orderId');
      var amount = params.get('amount');
      var currency = params.get('currency') || 'INR';
      var paymentId = params.get('paymentId');
      var ret = params.get('return') || 'rupayaid://payment-return';
      var name = params.get('name') || '';
      var email = params.get('email') || '';
      var contact = params.get('contact') || '';
      var description = params.get('desc') || 'Loan repayment';

      var statusEl = document.getElementById('status');
      var spinnerEl = document.getElementById('spinner');
      var errorEl = document.getElementById('error');
      var retryBtn = document.getElementById('retry');

      function fail(msg) {
        spinnerEl.style.display = 'none';
        statusEl.textContent = 'Checkout could not start';
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
      }

      function redirect(qs) {
        var sep = ret.indexOf('?') === -1 ? '?' : '&';
        var url = ret + sep + qs;
        statusEl.textContent = 'Returning to the app…';
        spinnerEl.style.display = 'block';
        errorEl.style.display = 'none';
        setTimeout(function () { location.href = url; }, 150);
      }

      function enc(k, v) { return encodeURIComponent(k) + '=' + encodeURIComponent(v || ''); }

      if (!keyId || !orderId || !amount || !paymentId) {
        fail('Missing checkout details.');
        return;
      }

      function openCheckout() {
        errorEl.style.display = 'none';
        retryBtn.style.display = 'none';
        if (!window.Razorpay) {
          fail('Checkout script failed to load.');
          return;
        }
        statusEl.textContent = 'Opening payment…';
        spinnerEl.style.display = 'block';

        var settled = false;
        var lastFailure = null;

        var rzp = new window.Razorpay({
          key: keyId,
          order_id: orderId,
          amount: amount,
          currency: currency,
          name: 'RupayAid',
          description: description,
          prefill: { name: name, email: email, contact: contact },
          theme: { color: '#0284C7' },
          handler: function (response) {
            if (settled) return;
            settled = true;
            redirect([
              enc('status', 'success'),
              enc('paymentId', paymentId),
              enc('razorpay_payment_id', response.razorpay_payment_id),
              enc('razorpay_order_id', response.razorpay_order_id),
              enc('razorpay_signature', response.razorpay_signature)
            ].join('&'));
          },
          modal: {
            ondismiss: function () {
              if (settled) return;
              settled = true;
              var qs = lastFailure
                ? [enc('status', 'failed'), enc('paymentId', paymentId), enc('reason', lastFailure)].join('&')
                : [enc('status', 'dismissed'), enc('paymentId', paymentId)].join('&');
              redirect(qs);
            }
          }
        });

        rzp.on('payment.failed', function (resp) {
          lastFailure = (resp && resp.error && resp.error.description) || 'The payment could not be completed';
        });

        rzp.open();
      }

      function waitForRazorpay(attempts) {
        if (window.Razorpay) { openCheckout(); return; }
        if (attempts <= 0) {
          fail('Checkout script failed to load. Check your connection and retry.');
          retryBtn.style.display = 'inline-block';
          return;
        }
        setTimeout(function () { waitForRazorpay(attempts - 1); }, 150);
      }

      retryBtn.addEventListener('click', function () {
        spinnerEl.style.display = 'block';
        statusEl.textContent = 'Loading checkout…';
        waitForRazorpay(40);
      });

      waitForRazorpay(40);
    })();
  </script>
</body>
</html>
